<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RETRO SOUND PAD</title>
<script src="lame.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a12;--panel:#12121f;--panel2:#1a1a2e;--border:#2a2a45;
  --red:#ff3355;--orange:#ff8833;--yellow:#ffdd33;--green:#33ff77;
  --cyan:#33ddff;--blue:#4477ff;--purple:#aa55ff;--pink:#ff55aa;
  --text:#b8b8d8;--dim:#4a4a6e;
}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;font-size:13px;
  min-height:100dvh;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);}

#page{max-width:1100px;margin:0 auto;padding:16px 14px 50px;}

/* header */
#hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
#logo{font-size:20px;font-weight:bold;letter-spacing:3px;color:var(--yellow);
  text-shadow:3px 3px 0 var(--red);}
.tbtn{background:var(--panel2);border:2px solid var(--border);color:var(--text);
  padding:10px 18px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:2px;
  border-radius:6px;transition:.12s;min-height:44px;font-weight:bold;}
.tbtn.rec{border-color:var(--red);color:var(--red);}
.tbtn.rec.on{background:var(--red);color:#fff;animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.6}}
#rectime{font-size:12px;color:var(--red);min-width:44px;}

/* controls */
#ctl{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px;
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;}
.cr{display:flex;align-items:center;gap:8px;min-height:40px;}
.cl{font-size:10px;color:var(--dim);letter-spacing:1px;}
.sl{width:130px;-webkit-appearance:none;appearance:none;height:40px;background:transparent;cursor:pointer;}
.sl::-webkit-slider-runnable-track{height:6px;background:var(--border);border-radius:3px;}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:var(--yellow);margin-top:-9px;}
.sl::-moz-range-track{height:6px;background:var(--border);border-radius:3px;}
.sl::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--yellow);border:none;}
.cv{font-size:11px;color:var(--yellow);min-width:34px;}

/* sections */
.stitle{font-size:12px;letter-spacing:4px;color:var(--dim);margin:20px 0 10px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
.pad{height:86px;border:2px solid;border-radius:10px;background:var(--panel2);
  cursor:pointer;font-family:inherit;font-weight:bold;font-size:12px;letter-spacing:1px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:transform .06s, box-shadow .06s;padding:4px;}
.pad .ico{font-size:22px;line-height:1;}
.pad:active,.pad.hit{transform:scale(0.94);}
.pad.hit{box-shadow:0 0 24px currentColor;}
</style>
</head>
<body>
<div id="page">

  <div id="hdr">
    <span id="logo">RETRO SOUND PAD</span>
    <button class="tbtn rec" id="recbtn" onclick="toggleRec()">● REC</button>
    <span id="rectime"></span>
  </div>

  <div id="ctl">
    <div class="cr">
      <span class="cl">PITCH</span>
      <input type="range" class="sl" min="-12" max="12" step="1" value="0"
        oninput="pitchOff=+this.value;this.parentElement.querySelector('.cv').textContent=(+this.value>0?'+':'')+this.value">
      <span class="cv">0</span>
    </div>
    <div class="cr">
      <span class="cl">8-BIT CRUNCH</span>
      <input type="range" class="sl" min="0" max="1" step="0.01" value="0"
        oninput="setCrunch(+this.value);this.parentElement.querySelector('.cv').textContent=Math.round(this.value*100)+'%'">
      <span class="cv">0%</span>
    </div>
    <div class="cr">
      <span class="cl">ECHO</span>
      <input type="range" class="sl" min="0" max="0.8" step="0.01" value="0"
        oninput="echoWet.gain.value=+this.value;this.parentElement.querySelector('.cv').textContent=Math.round(this.value/0.8*100)+'%'">
      <span class="cv">0%</span>
    </div>
    <div class="cr">
      <span class="cl">VOLUME</span>
      <input type="range" class="sl" min="0" max="1" step="0.01" value="0.8"
        oninput="masterGain.gain.value=+this.value;this.parentElement.querySelector('.cv').textContent=Math.round(this.value*100)+'%'">
      <span class="cv">80%</span>
    </div>
  </div>

  <div class="stitle">— EFFECTS —</div>
  <div class="grid" id="grid-fx"></div>

  <div class="stitle">— VOICES —</div>
  <div class="grid" id="grid-vo"></div>

  <div class="stitle">— JINGLES —</div>
  <div class="grid" id="grid-jg"></div>

</div>

<script>
// ── AUDIO ──────────────────────────────────────────────
const actx = new (window.AudioContext || window.webkitAudioContext)();
const masterGain = actx.createGain(); masterGain.gain.value = 0.8;
masterGain.connect(actx.destination);
const resume = () => actx.state === 'suspended' && actx.resume();
document.addEventListener('pointerdown', resume, {once:true});

// bus → crunch (waveshaper mix) → echo send → master
const bus = actx.createGain();
const crushShaper = actx.createWaveShaper();
function crushCurve(bits) {
  const steps = Math.pow(2, bits), n = 2048, c = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i/(n-1)*2-1; c[i] = Math.round(x*steps)/steps; }
  return c;
}
crushShaper.curve = crushCurve(3);
const crushWet = actx.createGain(); crushWet.gain.value = 0;
const crushDry = actx.createGain(); crushDry.gain.value = 1;
const post = actx.createGain();
bus.connect(crushDry); crushDry.connect(post);
bus.connect(crushShaper); crushShaper.connect(crushWet); crushWet.connect(post);
function setCrunch(v) {
  crushWet.gain.setTargetAtTime(v, actx.currentTime, 0.02);
  crushDry.gain.setTargetAtTime(1-v*0.8, actx.currentTime, 0.02);
}
const echo = actx.createDelay(1); echo.delayTime.value = 0.22;
const echoFb = actx.createGain(); echoFb.gain.value = 0.35;
const echoWet = actx.createGain(); echoWet.gain.value = 0;
echo.connect(echoFb); echoFb.connect(echo);
post.connect(echo); echo.connect(echoWet); echoWet.connect(masterGain);
post.connect(masterGain);

let pitchOff = 0;
const P = () => Math.pow(2, pitchOff/12); // global pitch multiplier

// helpers
function osc(type, f, t) { const o = actx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f*P(), t); return o; }
function env(t, a, peak, dur) {
  const g = actx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t+a);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  g.connect(bus);
  return g;
}
function nbuf(dur, hold) {
  const n = Math.ceil(actx.sampleRate*dur), b = actx.createBuffer(1,n,actx.sampleRate);
  const d = b.getChannelData(0);
  let v = 0;
  for (let i=0;i<n;i++) { if (!hold || i%hold===0) v = Math.random()*2-1; d[i]=v; }
  return b;
}
function blip(f, t, dur, type, vol) {
  const o = osc(type||'square', f, t), g = env(t, 0.004, vol||0.25, dur);
  o.connect(g); o.start(t); o.stop(t+dur+0.02);
}
function sweep(type, f1, f2, t, dur, vol) {
  const o = osc(type, f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f2*P()), t+dur);
  const g = env(t, 0.005, vol||0.3, dur);
  o.connect(g); o.start(t); o.stop(t+dur+0.02);
}
function noiseHit(t, dur, filtType, freq, vol, hold) {
  const s = actx.createBufferSource(); s.buffer = nbuf(dur, hold);
  const f = actx.createBiquadFilter(); f.type = filtType; f.frequency.setValueAtTime(freq, t);
  const g = env(t, 0.004, vol, dur);
  s.connect(f); f.connect(g); s.start(t); s.stop(t+dur+0.02);
  return f;
}
const rnd = (a,b) => a + Math.random()*(b-a);

// ── EFFECTS ────────────────────────────────────────────
const SFX = {
  jump(t)   { sweep('square', 160, 620, t, 0.16, 0.28); },
  coin(t)   { blip(988, t, 0.09, 'square', 0.22); blip(1319, t+0.09, 0.28, 'square', 0.22); },
  laser(t)  { sweep('sawtooth', 1900, 180, t, 0.19, 0.26); },
  powerup(t){ [262,330,392,523,659,784].forEach((f,i)=>blip(f, t+i*0.055, 0.06, 'square', 0.2)); },
  explode(t){ const f = noiseHit(t, 0.75, 'lowpass', 2800, 0.75, 3);
              f.frequency.exponentialRampToValueAtTime(120, t+0.7);
              sweep('sine', 110, 30, t, 0.5, 0.5); },
  hit(t)    { noiseHit(t, 0.1, 'highpass', 1200, 0.3, 2); sweep('square', 400, 90, t, 0.12, 0.3); },
  zap(t)    { const o = osc('square', 520, t);
              const l = actx.createOscillator(); l.frequency.value = 38;
              const lg = actx.createGain(); lg.gain.value = 260*P();
              l.connect(lg); lg.connect(o.frequency);
              const g = env(t, 0.005, 0.24, 0.22);
              o.connect(g); o.start(t); o.stop(t+0.24); l.start(t); l.stop(t+0.24); },
  swoosh(t) { const f = noiseHit(t, 0.3, 'bandpass', 300, 0.3, 2);
              f.frequency.exponentialRampToValueAtTime(3200, t+0.28); f.Q.value = 2; },
  bounce(t) { sweep('square', 500, 150, t, 0.09, 0.25); sweep('square', 150, 460, t+0.1, 0.1, 0.22); },
  warp(t)   { const o = osc('sine', 180, t);
              o.frequency.exponentialRampToValueAtTime(1400*P(), t+0.7);
              const v = actx.createOscillator(); v.frequency.value = 11;
              const vg = actx.createGain(); vg.gain.value = 80*P();
              v.connect(vg); vg.connect(o.frequency);
              const g = env(t, 0.02, 0.26, 0.75);
              o.connect(g); o.start(t); o.stop(t+0.78); v.start(t); v.stop(t+0.78); },
  alarm(t)  { [0,0.18,0.36].forEach(d=>{ blip(880, t+d, 0.09, 'square', 0.22); blip(660, t+d+0.09, 0.09, 'square', 0.22); }); },
  step(t)   { noiseHit(t, 0.045, 'bandpass', 900, 0.22, 4); },
};

// ── VOICES ─────────────────────────────────────────────
// Talk blips: strings of short square notes = retro dialogue voices
function talk(t, base, count, spread, type, dur) {
  for (let i = 0; i < count; i++) {
    const f = base * rnd(1-spread, 1+spread);
    blip(f, t + i*(dur+0.028), dur, type, 0.18);
  }
}
const VOICES = {
  talkHi(t)  { talk(t, 620, 9, 0.22, 'square', 0.042); },
  talkMid(t) { talk(t, 340, 8, 0.18, 'square', 0.05); },
  talkLow(t) { talk(t, 170, 7, 0.15, 'square', 0.06); },
  robot(t)   { for (let i=0;i<6;i++) blip(200 + (i%2)*40, t+i*0.085, 0.06, 'sawtooth', 0.17); },
  alien(t)   { const o = osc('sine', 700, t);
               for (let i=1;i<=5;i++) o.frequency.exponentialRampToValueAtTime(rnd(300,1100)*P(), t+i*0.12);
               const g = env(t, 0.02, 0.2, 0.65);
               o.connect(g); o.start(t); o.stop(t+0.68); },
  yes(t)     { sweep('square', 350, 700, t, 0.12, 0.22); sweep('square', 460, 900, t+0.13, 0.14, 0.22); },
  no(t)      { sweep('square', 500, 250, t, 0.14, 0.22); sweep('square', 400, 180, t+0.15, 0.17, 0.22); },
  hyah(t)    { const o = osc('sawtooth', 480, t);
               o.frequency.exponentialRampToValueAtTime(190*P(), t+0.16);
               const f = actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=2;
               const g = env(t, 0.008, 0.5, 0.2);
               o.connect(f); f.connect(g); o.start(t); o.stop(t+0.22);
               noiseHit(t, 0.09, 'bandpass', 1600, 0.18, 2); },
  growl(t)   { const o = osc('sawtooth', 75, t);
               const l = actx.createOscillator(); l.frequency.value = 13;
               const lg = actx.createGain(); lg.gain.value = 22*P();
               l.connect(lg); lg.connect(o.frequency);
               const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420;
               const g = env(t, 0.03, 0.5, 0.75);
               o.connect(f); f.connect(g); o.start(t); o.stop(t+0.78); l.start(t); l.stop(t+0.78); },
  hurt(t)    { sweep('square', 640, 220, t, 0.09, 0.26); sweep('square', 500, 160, t+0.09, 0.11, 0.24); },
  laugh(t)   { [420,380,420,380,420].forEach((f,i)=>blip(f*rnd(0.96,1.04), t+i*0.09, 0.055, 'square', 0.18)); },
  snore(t)   { const o = osc('sawtooth', 90, t);
               o.frequency.linearRampToValueAtTime(70*P(), t+0.5);
               const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300;
               const g = env(t, 0.15, 0.35, 0.8);
               o.connect(f); f.connect(g); o.start(t); o.stop(t+0.85); },
};

// ── JINGLES ────────────────────────────────────────────
function tune(t, notes, step, dur, type, vol) {
  notes.forEach((n,i) => { if (n) blip(n, t+i*step, dur, type||'square', vol||0.2); });
}
const N = {C4:262,D4:294,E4:330,F4:349,G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,G5:784,
  Eb4:311,Ab4:415,Bb4:466,B3:247,A3:220,G3:196,E3:165,C3:131};
const JINGLES = {
  oneUp(t)    { tune(t, [N.E4,N.G4,N.E5,N.C5,N.D5,N.G5], 0.11, 0.1); },
  gameOver(t) { tune(t, [N.C5,N.G4,N.E4,N.A4,N.B4,N.A4,N.Ab4,N.Bb4,N.Ab4,N.G4], 0.16, 0.15); },
  victory(t)  { tune(t, [N.C4,N.E4,N.G4,N.C5,0,N.G4,N.C5], 0.12, 0.11);
                tune(t, [N.C3,0,0,N.E3,0,0,N.G3], 0.12, 0.3, 'triangle', 0.25); },
  secret(t)   { tune(t, [N.G4,N.Fs4||370,N.Eb4,N.A3,N.Ab4,N.E4,N.Ab4,N.C5], 0.09, 0.08); },
  levelUp(t)  { tune(t, [N.C4,N.D4,N.E4,N.F4,N.G4,N.A4,N.B4,N.C5], 0.07, 0.065); },
  fanfare(t)  { tune(t, [N.G4,N.G4,N.G4,N.E4,0,N.G4,0,N.C5], 0.1, 0.09);
                tune(t, [N.C3,0,0,0,N.G3,0,0,N.C3], 0.1, 0.25, 'triangle', 0.22); },
  sleep(t)    { tune(t, [N.C5,N.A4,N.F4,N.D4,N.C4], 0.22, 0.3, 'sine', 0.2); },
  question(t) { tune(t, [N.E4,0,N.A4,0,N.C5,N.D5], 0.08, 0.07); },
};

// ── PAD GRID ───────────────────────────────────────────
const PADS = [
  ['grid-fx', SFX, [
    ['jump','JUMP','🕹️','--green'],  ['coin','COIN','🪙','--yellow'],
    ['laser','LASER','🔫','--red'],  ['powerup','POWER-UP','⭐','--orange'],
    ['explode','EXPLODE','💥','--red'],['hit','HIT','👊','--orange'],
    ['zap','ZAP','⚡','--cyan'],     ['swoosh','SWOOSH','💨','--blue'],
    ['bounce','BOUNCE','🏀','--green'],['warp','WARP','🌀','--purple'],
    ['alarm','ALARM','🚨','--red'],  ['step','STEP','👟','--dim'],
  ]],
  ['grid-vo', VOICES, [
    ['talkHi','TALK HI','💬','--pink'],  ['talkMid','TALK MID','💬','--cyan'],
    ['talkLow','TALK LOW','💬','--blue'],['robot','ROBOT','🤖','--dim'],
    ['alien','ALIEN','👾','--purple'],   ['yes','YES!','✅','--green'],
    ['no','NO!','❌','--red'],           ['hyah','HYAH!','⚔️','--orange'],
    ['growl','GROWL','🐲','--red'],      ['hurt','HURT','💢','--orange'],
    ['laugh','LAUGH','😆','--yellow'],   ['snore','SNORE','💤','--blue'],
  ]],
  ['grid-jg', JINGLES, [
    ['oneUp','1-UP','🍄','--green'],     ['gameOver','GAME OVER','☠️','--red'],
    ['victory','VICTORY','🏆','--yellow'],['secret','SECRET','🗝️','--purple'],
    ['levelUp','LEVEL UP','📈','--cyan'],['fanfare','FANFARE','🎺','--orange'],
    ['sleep','SLEEP','🌙','--blue'],     ['question','???','❓','--pink'],
  ]],
];

PADS.forEach(([gridId, bank, defs]) => {
  const grid = document.getElementById(gridId);
  defs.forEach(([key, label, ico, colorVar]) => {
    const b = document.createElement('button');
    b.className = 'pad';
    const col = getComputedStyle(document.documentElement).getPropertyValue(colorVar) || '#888';
    b.style.borderColor = col; b.style.color = col;
    b.innerHTML = `<span class="ico">${ico}</span>${label}`;
    b.addEventListener('pointerdown', () => {
      resume();
      bank[key](actx.currentTime);
      b.classList.add('hit');
      setTimeout(()=>b.classList.remove('hit'), 150);
    });
    grid.appendChild(b);
  });
});

// ── RECORDING → MP3 ────────────────────────────────────
const capNode = actx.createScriptProcessor(4096, 2, 2);
masterGain.connect(capNode);
capNode.connect(actx.destination);
let recOn = false, recL = [], recR = [];
capNode.onaudioprocess = e => {
  if (!recOn) return;
  recL.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  recR.push(new Float32Array(e.inputBuffer.getChannelData(1)));
};
let recTimer = null, recStart = 0, trackNum = 1;
function flat(chunks) {
  let len = 0; chunks.forEach(c => len += c.length);
  const out = new Float32Array(len);
  let off = 0; chunks.forEach(c => { out.set(c, off); off += c.length; });
  return out;
}
function f32toI16(f) {
  const out = new Int16Array(f.length);
  for (let i = 0; i < f.length; i++) {
    const s = Math.max(-1, Math.min(1, f[i]));
    out[i] = s < 0 ? s*0x8000 : s*0x7FFF;
  }
  return out;
}
function encodeMP3(L, R, sr) {
  const enc = new lamejs.Mp3Encoder(2, sr, 192);
  const l = f32toI16(L), r = f32toI16(R);
  const block = 1152, parts = [];
  for (let i = 0; i < l.length; i += block) {
    const chunk = enc.encodeBuffer(l.subarray(i, i+block), r.subarray(i, i+block));
    if (chunk.length) parts.push(chunk);
  }
  const end = enc.flush();
  if (end.length) parts.push(end);
  return new Blob(parts, {type:'audio/mp3'});
}
function encodeWAV(L, R, sr) {
  const n = L.length, buf = new ArrayBuffer(44 + n*4), v = new DataView(buf);
  const ws = (o,s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4, 36+n*4, true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,2,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*4,true); v.setUint16(32,4,true);
  v.setUint16(34,16,true); ws(36,'data'); v.setUint32(40,n*4,true);
  let off = 44;
  for (let i = 0; i < n; i++) {
    let s = Math.max(-1, Math.min(1, L[i])); v.setInt16(off, s<0?s*0x8000:s*0x7FFF, true); off += 2;
    s = Math.max(-1, Math.min(1, R[i]));     v.setInt16(off, s<0?s*0x8000:s*0x7FFF, true); off += 2;
  }
  return new Blob([buf], {type:'audio/wav'});
}
function toggleRec() {
  resume();
  const btn = document.getElementById('recbtn'), time = document.getElementById('rectime');
  if (!recOn) {
    recL = []; recR = []; recOn = true; recStart = Date.now();
    btn.textContent = '■ SAVE'; btn.classList.add('on');
    recTimer = setInterval(()=>{
      const s = Math.floor((Date.now()-recStart)/1000);
      time.textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    }, 500);
    time.textContent = '00:00';
  } else {
    recOn = false; clearInterval(recTimer);
    btn.textContent = '● REC'; btn.classList.remove('on');
    time.textContent = 'ENCODING…';
    setTimeout(() => {
      const L = flat(recL), R = flat(recR);
      recL = []; recR = [];
      let blob, ext;
      try {
        if (typeof lamejs === 'undefined') throw new Error('no encoder');
        blob = encodeMP3(L, R, actx.sampleRate); ext = 'mp3';
      } catch(e) {
        blob = encodeWAV(L, R, actx.sampleRate); ext = 'wav';
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `soundpad-${trackNum++}.${ext}`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
      time.textContent = '';
    }, 50);
  }
}
</script>
</body>
</html>
