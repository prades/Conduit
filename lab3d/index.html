<script src="lab3d.js?v=dd7494c1a8"></script>
<script>
// Starts the room (lab3d.js: window.__lab3d) and wires the readout and the three switches. In the address: ?ink=0, ?shadows=0, ?sharp=1|1.5|2 set them from the start;
// ?gl=1 draws with WebGL 1 (as an iPad before iPadOS 15 does); ?test=N draws N frames at once, a tenth of a second apart on a clock of their own, and leaves what it measured in a hidden block, lab3d-test (tests/lab3d.js).
(function () {
  var q = new URLSearchParams(location.search), wait = document.getElementById('wait'), why = document.getElementById('why');
  window.__lab3dErrors = []; window.addEventListener('error', function (e) { window.__lab3dErrors.push(String(e.message || e)); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  function fail(m) { wait.style.display = 'flex'; wait.firstChild.nodeValue = 'THE ROOM DID NOT START'; why.textContent = m; window.__lab3dErrors.push(m); }
  function leave(o) { var pre = document.createElement('pre'); pre.id = 'lab3d-test'; pre.style.display = 'none'; pre.textContent = JSON.stringify(o); document.body.appendChild(pre); }
  setTimeout(function () {   // (a moment first, so the sign is painted before the building holds the page)
    try {
      if (!window.THREE || !window.__lab3d) { fail('its scripts did not load'); if (q.get('test')) leave({ errors: window.__lab3dErrors }); return; }
      var steps = [1, 1.5, 2], fps = document.getElementById('fps'), more = document.getElementById('more');
      function label(st) { set('b-ink', st.ink ? 'ON' : 'OFF', st.ink); set('b-shadows', st.shadows ? 'ON' : 'OFF', st.shadows); set('b-sharp', st.sharp + '×', true); }
      function set(id, t, on) { var b = document.getElementById(id); b.lastChild.textContent = t; b.className = on ? '' : 'off'; }
      var api = window.__lab3d(window.__lab3dMap, { canvas: document.getElementById('room'), gl1: q.get('gl') === '1', test: +q.get('test') || 0, sharp: +q.get('sharp') || 1.5, ink: q.get('ink') !== '0', shadows: q.get('shadows') !== '0',
        onStats: function (s, st) { fps.firstChild.nodeValue = s.fps ? String(Math.round(s.fps)) : '–';
          more.textContent = (s.ms ? s.ms.toFixed(1) + ' ms a frame · worst ' + Math.round(s.worst) + '\n' : '') + s.draws + ' draws · ' + Math.round(s.tris / 1000) + 'k triangles\n' + s.w + ' × ' + s.h + ' · WebGL ' + s.webgl; label(st); },
        onDone: function (s, st) { leave({ stats: s, state: st, errors: window.__lab3dErrors }); } });
      window.__lab3dApi = api;
      label(api.state);
      document.getElementById('b-ink').onclick = function () { api.set('ink', !api.state.ink); label(api.state); };
      document.getElementById('b-shadows').onclick = function () { api.set('shadows', !api.state.shadows); label(api.state); };
      document.getElementById('b-sharp').onclick = function () { api.set('sharp', steps[(steps.indexOf(api.state.sharp) + 1) % steps.length]); label(api.state); };
      wait.style.display = 'none';
    } catch (e) { fail(String((e && e.message) || e)); if (q.get('test')) leave({ errors: window.__lab3dErrors }); }
  }, 60);
})();
</script>
